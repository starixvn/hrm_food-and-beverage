
<div>
	<div class="modal-header">
		<div class="popup-header">
			{{"CreateFoodMenu" | translate}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body assign-role-modal">
        <div class="filterRow">
            <div class="label width-120"><label>Menu name (Vie):</label></div>
            <div class="field"><input type="text" /></div>
            <div class="label width-90"><label>(Eng)</label></div>
            <div class="field"><input type="text" /></div>
            <div class="label width-90"><label>Meal:</label></div>
            <div class="field">
                <select>
                    <option>2 selected</option>
                </select>
            </div>
            <div class="label width-140"><label>Employee Type:</label></div>
            <div class="field">
                <select>
                    <option>2 selected</option>
                </select>
            </div>
        </div>
        <div class="filterRow">
            <div class="label width-120"><label>Price per meal:</label></div>
            <div class="field"><input type="text"/></div>
            <div class="label width-90"><label>Price per day:</label></div>
            <div class="field"><input type="text" /></div>
            <div class="label width-90"><label>Vegetarian:</label></div>
            <div class="field width-110"><input type="checkbox" /></div>
            <div class="label width-140"><label>Active:</label></div>
            <div class="field width-110"><input type="checkbox"/></div>
        </div>
        <div class="filterRow">
            <label>Food items:</label>
        </div>
	</div>

	<div class="modal-footer">
		<button class="button" get-meal-registration data-translate="Submit">
		</button>
		<button class="button" get-meal-registration data-translate="SubmitContinue">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
