
<div>
	<div class="modal-header">
		<div class="popup-header">
			{{"CreateFoodMenu" | translate}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body assign-role-modal">
        <div class="filterRow">
            <div class="label width-120"><label>{{"FoodMenuNameVnm" | translate}}:</label></div>
            <div class="field"><input type="text" /></div>
            <div class="label width-90"><label>{{"FoodEngName" | translate}}:</label></div>
            <div class="field"><input type="text" /></div>
            <div class="label width-90"><label>{{"Meal" | translate}}:</label></div>
            <div class="field">
				<select multi-select input-model="mealsOption" button-label="MealEngName" helper-elements="all none"
					item-label="MealEngName" tick-property="ticked" max-labels="0" class="multi-select">
				</select>
            </div>
            <div class="label width-140"><label>{{"EmployeeType" | translate}}:</label></div>
            <div class="field">
				<select multi-select input-model="employeeTypesOption" button-label="EmployeeTypeId" helper-elements="all none"
					item-label="EmployeeTypeName" tick-property="ticked" max-labels="0" class="multi-select">
				</select>
            </div>
        </div>
        <div class="filterRow">
            <div class="label width-120"><label>{{"PricePerMeal" | translate}}:</label></div>
            <div class="field"><input type="text"/></div>
            <div class="label width-90"><label>{{"PricePerDay" | translate}}:</label></div>
            <div class="field"><input type="text" /></div>
            <div class="label width-90"><label>{{"Vegetarian" | translate}}:</label></div>
            <div class="field width-110"><input type="checkbox" /></div>
            <div class="label width-140"><label>{{"Active" | translate}}:</label></div>
            <div class="field width-110"><input type="checkbox"/></div>
        </div>
        <div class="filterRow">
            <label>{{"FoodItems" | translate}}:</label>
        </div>
	</div>

	<div class="modal-footer">
		<button class="button" data-translate="Submit">
		</button>
		<button class="button" data-translate="SubmitContinue">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
