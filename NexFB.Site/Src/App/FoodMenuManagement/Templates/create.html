
<div>
	<div class="modal-header">
		<div class="popup-header">
			{{"CreateFoodMenu" | translate}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body food-menu-body-modal">
        <form class="form-horizontal form-menuManagement" role="form" name="form" ng-init="setFormScope(this)">
            <div class="form-group required">
                <label class="col-sm-1 text-right short-text control-label">{{"FoodMenuVnm" | translate}}</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" name="vnmName" ng-model="foodMenu.menuVnmName" required />
                </div>
                <label class="col-sm-1 text-right short-text control-label">{{"ShortEng" | translate}}</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" name="engName" ng-model="foodMenu.menuEngName" required />
                </div>
                <label class="col-sm-1 text-right short-text control-label">{{"Meal" | translate}}</label>
                <div class="col-sm-2 field selectbox">
					<add-class-to-role-filter multi-select input-model="mealsOption" button-label="MealEngName" helper-elements="all reset"
						item-label="MealEngName" tick-property="ticked" max-labels="0" class="multi-select ">
					</add-class-to-role-filter>
                </div>
                <label class="col-sm-1 text-right long-text control-label">{{"EmployeeType" | translate}}</label>
                <div class="col-sm-2 field selectbox">
					<add-class-to-role-filter multi-select input-model="employeeTypesOption" button-label="EmployeeTypeId" helper-elements="all reset"
						item-label="EmployeeTypeName" tick-property="ticked" max-labels="0" class="multi-select employee-type">
					</add-class-to-role-filter>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-1 text-right short-text">{{"ShortPricePerMeal" | translate}}</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" ng-model="foodMenu.pricePerMeal" number-only="number" >
				</div>
				<label class="col-sm-1 text-right short-text">{{"ShortPricePerDay" | translate}}</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" ng-model="foodMenu.pricePerDay" number-only="number" />
                </div>
                <div class="list-checkbox">                    
                    <label class="checkbox-inline"><input type="checkbox" ng-model="foodMenu.isVegetarian" /> {{"Vegetarian" | translate}}</label>
                    <label class="checkbox-inline"><input type="checkbox" ng-model="foodMenu.isActive" /> {{"Active" | translate}}</label>
                </div>
			</div>
			<div class="form-group">
				<label class="filterRow">{{"FoodItems" | translate}}:</label>
				<div class="menu-box">
					<select name="foodSelect" class="chosen-select" data-placeholder="Select food item(s)" multiple multi-select-chosen name="foodItemGroup"
						ng-model="foodMenu.rawFoodIds" ng-options="opt.FoodId as opt.FoodVnmName for opt in groupOptions">
					</select>
                </div>
            </div>
        </form>
	</div>

	<div class="modal-footer">
		<button class="button" data-translate="Submit" ng-click="addFoodMenu(foodMenu)" ng-disabled="disabledSubmitButton" >
		</button>
		<button class="button" reset-food-menu data-translate="SubmitContinue" ng-click="addAndContinue(foodMenu)" ng-disabled="disabledSubmitButton" >
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
