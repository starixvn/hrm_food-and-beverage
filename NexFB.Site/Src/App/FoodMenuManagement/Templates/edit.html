<div>
	<div class="modal-header">
		<div class="popup-header">
			{{"EditFoodMenu" | translate}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body assign-role-modal">
        <form class="form-horizontal form-menuManagement" role="form">
            <div class="form-group">
                <label class="col-sm-1 text-right long-text">Menu name (Vie):</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" />
                </div>
                <label class="col-sm-1 text-right short-text">(Eng):</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control"/>
                </div>
                <label class="col-sm-1 text-right short-text">Meal:</label>
                <div class="col-sm-2 field">
                    <select class="form-control">
                        <option>2 selected</option>
                    </select>
                </div>
                <label class="col-sm-1 text-right long-text">Employee Type:</label>
                <div class="col-sm-2 field">
                    <select class="form-control">
                        <option>2 selected</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-1 text-right long-text">Price per meal:</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" />
        </div>
        <div>
            <label class="filterRow">Food items:</label>
			<div class="menu-box">
				<select name="foodSelect" class="chosen-select" data-placeholder="Select the food item" multiple multi-select-chosen name="foodItemGroup"
					ng-model="foodMenu.rawFoodIds" ng-options="opt.FoodId as opt.FoodVnmName for opt in groupOptions">
				</select>
                </div>
                <label class="col-sm-1 text-right short-text">Price per day:</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control"/>
                </div>
                <label class="col-sm-1 text-right short-text">Vegetarian:</label>
                <div class="col-sm-2 field">
                    <input type="checkbox" />
                </div>
                <label class="col-sm-1 text-right long-text">Active:</label>
                <div class="col-sm-2 field">
                    <input type="checkbox"/>
                </div>
            </div>
        </form>
	</div>

	<div class="modal-footer">
		<button class="button" data-translate="Submit" ng-click="updateFoodMenu(foodMenu)" >
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
