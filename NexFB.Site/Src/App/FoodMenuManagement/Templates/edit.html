<div>
	<div class="modal-header">
		<div class="popup-header">
			{{"EditFoodMenu" | translate}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body food-menu-body-modal">
        <form class="form-horizontal form-menuManagement" role="form">
            <div class="form-group">
                <label class="col-sm-1 text-right long-text">{{"FoodMenuNameVnm" | translate}}:</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" ng-model="foodMenu.MenuVnmName" />
                </div>
                <label class="col-sm-1 text-right short-text">{{"FoodEngName" | translate}}:</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" ng-model="foodMenu.MenuEngName" />
                </div>
                <label class="col-sm-1 text-right short-text">{{"Meal" | translate}}:</label>
                <div class="col-sm-2 field selectbox">
					<add-class-to-role-filter multi-select input-model="mealsOption" button-label="MealEngName" helper-elements="all reset"
						item-label="MealEngName" tick-property="ticked" max-labels="0" class="multi-select">
					</add-class-to-role-filter>
                </div>
                <label class="col-sm-1 text-right long-text">{{"EmployeeType" | translate}}:</label>
                <div class="col-sm-2 field selectbox">
					<add-class-to-role-filter multi-select input-model="employeeTypesOption" button-label="EmployeeTypeId" helper-elements="all reset"
						item-label="EmployeeTypeName" tick-property="ticked" max-labels="0" class="multi-select employee-type">
					</add-class-to-role-filter>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-1 text-right long-text">{{"PricePerMeal" | translate}}:</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" ng-model="foodMenu.PricePerMeal" number-only="number" />
				</div>
				<label class="col-sm-1 text-right short-text">{{"PricePerDay" | translate}}:</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" ng-model="foodMenu.PricePerDay" number-only="number" />
                </div>
                <label class="col-sm-1 text-right short-text">{{"Vegetarian" | translate}}:</label>
                <div class="col-sm-2 field selectbox">
                    <input type="checkbox" ng-model="foodMenu.IsVegetarian" />
                </div>
                <label class="col-sm-1 text-right long-text">{{"Active" | translate}}:</label>
                <div class="col-sm-2 field">
                    <input type="checkbox" ng-model="foodMenu.IsActive"/>
                </div>
			</div>
			<div>
				<label class="filterRow">{{"FoodItems" | translate}}:</label>
				<div class="menu-box">
					<select name="foodSelect" class="chosen-select" data-placeholder="Select the food item" multiple multi-select-chosen name="foodItemGroup"
						ng-model="foodMenu.rawFoodIds" ng-options="opt.FoodId as opt.FoodVnmName for opt in groupOptions" 
						disable-chosen-select enable-chosen-select >
					</select>
				</div>
            </div>
        </form>
	</div>

	<div class="modal-footer">
		<button class="button" data-translate="Submit" ng-click="updateFoodMenu(foodMenu)" >
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
