<div>
    <div class="modal-header">
        <div class="popup-header">
            {{"History" | translate}}<span class="close-popup" ng-click="cancel()"></span>
        </div>
    </div>

    <div class="modal-body food-menu-body-modal">
        <form class="form-horizontal form-multiLine table-bordered pad-10" role="form">
            <div class="form-group">
                <p><b>{{"CurrentFoodMenu" | translate}}</b></p>
                <label class="col-sm-1 text-right short-text control-label">{{"EffectedFrom" | translate}}</label>
                <div class="col-sm-2 field">
                    <input class="calendar-form-control" type="text" ng-model="foodMenu.currentBeginDate" datepicker-popup disabled />
                    <calendar-image class="calendar-image"></calendar-image>
                </div>
                <label class="col-sm-1 text-right short-text control-label">{{"Effectedto" | translate}}</label>
                <div class="col-sm-2 field">
                    <input class="calendar-form-control" type="text" ng-model="foodMenu.currentEndDate" datepicker-popup
                           is-open="calendar.currentEffectedEndDate" ng-change="onChangeCurrentEndDate()" />
                    <calendar-image class="calendar-image" ng-click="openCurrentEffectedEndDateCalendar($event)"></calendar-image>
                </div>
                <label class="col-sm-1 text-right short-text control-label">{{"ShortPricePerMeal" | translate}}</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" name="PricePerMeal" maxlength="10" ng-model="foodMenu.currentPricePerMeal" number-only="number" />
                </div>
                <label class="col-sm-1 text-right short-text control-label">{{"ShortPricePerDay" | translate}}</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" name="PricePerDay" maxlength="10" ng-model="foodMenu.currentPricePerDay" number-only="number" />
                </div>
            </div>
            <div class="form-group">
                <p><b>{{"NewFoodMenu" | translate}}</b></p>
                <label class="col-sm-1 text-right short-text control-label">{{"EffectedFrom" | translate}}</label>
                <div class="col-sm-2 field">
                    <input class="calendar-form-control" type="text" ng-model="foodMenu.newBeginDate" datepicker-popup
                           is-open="calendar.editStartDateOpened" disabled />
                    <calendar-image class="calendar-image"></calendar-image>
                </div>
                <label class="col-sm-1 text-right short-text control-label">{{"EffectedTo" | translate}}</label>
                <div class="col-sm-2 field">
                    <input class="calendar-form-control" type="text" ng-model="foodMenu.newEndDate" datepicker-popup
                           is-open="calendar.newEndDateOpened" disabled />
                    <calendar-image class="calendar-image"></calendar-image>
                </div>
                <label class="col-sm-1 text-right short-text control-label">{{"ShortPricePerMeal" | translate}}</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" name="PricePerMeal" maxlength="10" ng-model="foodMenu.newPricePerMeal" number-only="number" />
                </div>
                <label class="col-sm-1 text-right short-text control-label">{{"ShortPricePerDay" | translate}}</label>
                <div class="col-sm-2 field">
                    <input type="text" class="form-control" name="PricePerDay" maxlength="10" ng-model="foodMenu.newPricePerDay" number-only="number" />
                </div>
            </div>
            <div class="form-group text-right">
                <div class="pad-10">
                    <button class="button" data-translate="Add" ng-click="onUpdateFoodMenu(foodMenu)"></button>
                </div>
            </div>
        </form>
        <div class="row table-menu">
            <table class="table table-bordered table-striped col-sm-12">
                <thead>
                    <tr>
                        <th colspan="5" class="force-text-left">{{"FoodMenuHistory" | translate}}</th>
                    </tr>
                    <tr>
                        <th data-translate="SymbolCount"></th>
                        <th data-translate="EffectedBeginDate"></th>
                        <th data-translate="EffectedEndDate"></th>
                        <th data-translate="PricePerMeal"></th>
                        <th data-translate="PricePerDay"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="history in histories track by $index">
                        <td class="text-center" ng-bind="$index + 1"></td>
                        <td class="text-center" ng-bind="history.EffectedDateBegin | customDate"></td>
                        <td class="text-center" ng-bind="history.EffectedDateEnd | customDate"></td>
                        <td class="text-right" ng-bind="history.PricePerMeal | number"></td>
                        <td class="text-right" ng-bind="history.PricePerDay | number"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal-footer">
        <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel"></button>
    </div>
</div>
