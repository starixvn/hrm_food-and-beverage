<div class="col-sm-12">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li class="current" data-translate="FoodMenuManagement"></li>
        </ul>
    </div>
    <div class="row filter">
        <form class="form-inline" role="form">
            <div class="form-group">
                <label data-translate="Meal"></label>
                <select ng-model="filter.mealId" ng-options="opt.MealId as opt.MealEngName for opt in mealsOption"
                        required class="form-control">
                    <option value="">-- {{"AllMeals" | translate}} --</option>
                </select>
            </div>
            <div class="form-group">
                <label data-translate="EmployeeType"></label>
                <select ng-model="filter.employeeTypeId" ng-options="opt.EmployeeTypeId as opt.EmployeeTypeName for opt in employeeTypesOption"
                        required class="form-control">
                    <option value="">-- {{"AllTypes" | translate}} --</option>
                </select>
            </div>
            <div class="form-group">
                <label data-translate="Status"></label>
                <select ng-model="filter.isActive">
                    <option selected value="" data-translate="AllStatuses"></option>
                    <option value="true" data-translate="Active"></option>
                    <option value="false" data-translate="InActive"></option>
                </select>
            </div>
            <div class="form-group">
                <input type="button" value="Submit" class="button" ng-click="query(filter)" />
            </div>
        </form>
    </div>
    <div class="row table-menu">
        <table class="table table-bordered table-striped col-sm-12">
            <thead>
                <tr class="header-table">
                    <th colspan="11" ng-show="policy.permission == 2">
                        <a class="pull-left button-icon create-button" ng-click="addFoodMenu()">
                            <span class="icon plus"></span>
                            <span class="button-text" data-translate="CreateFoodMenu"></span>
                        </a>
                        <input type="text" ng-model="queryData" ng-change="search()" class="search-inline-textbox search pull-right">
                    </th>
                    <th colspan="10" ng-show="policy.permission == 1">
                        <input type="text" ng-model="queryData" ng-change="search()" class="search-inline-textbox search pull-right">
                    </th>
                </tr>
                <tr>
                    <th data-translate="SymbolCount"></th>
                    <th data-translate="FoodMenuVnm"></th>
                    <th data-translate="FoodMenuEng"></th>
                    <th data-translate="Meal"></th>
                    <th class="" data-translate="ShortVegetarian"></th>
                    <th class="width-170" data-translate="EmployeeType"></th>
                    <th class="width-120" data-translate="ShortPricePerMeal"></th>
                    <th class="width-120" data-translate="ShortPricePerDay"></th>
                    <th class="width-40" data-translate="SetMenu"></th>
                    <th class="width-60" data-translate="Active"></th>
                    <th class="width-80" data-translate="Action" ng-if="policy.permission == 2"></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="foodMenu in pagedItems[currentPage] track by foodMenu.MenuId">
                    <td class="text-center" ng-bind="foodMenu.itemIndex + 1"></td>
                    <td ng-bind="foodMenu.MenuVnmName"></td>
                    <td ng-bind="foodMenu.MenuEngName"></td>
                    <td>
                        <div ng-if="foodMenu.Meals.length == 1">
                            <span ng-bind="foodMenu.Meals[0].MealEngName"></span>
                        </div>
                        <div ng-if="foodMenu.Meals.length > 1">
                            <ul class="group-toggle-item">
                                <li ng-repeat="meal in foodMenu.Meals" ng-bind="meal.MealEngName"></li>
                            </ul>
                        </div>
                    </td>
                    <td>
                        <span ng-if="foodMenu.IsVegetarian" data-translate="Yes"></span>
                        <span ng-if="!foodMenu.IsVegetarian" data-translate="No"></span>
                    </td>
                    <td>
                        <div ng-if="foodMenu.EmployeeTypes.length == 1">
                            <span ng-bind="foodMenu.EmployeeTypes[0].EmployeeTypeName"></span>
                        </div>
                        <div ng-if="foodMenu.EmployeeTypes.length > 1">
                            <ul class="group-toggle-item">
                                <li ng-repeat="type in foodMenu.EmployeeTypes" ng-bind="type.EmployeeTypeName"></li>
                            </ul>
                        </div>
                    </td>
                    <td class="text-right" ng-bind="foodMenu.PricePerMeal | number"></td>
                    <td class="text-right" ng-bind="foodMenu.PricePerDay | number"></td>
                    <td class="text-center">
                        <span>{{foodMenu.SetMenus.length}}</span>
                    </td>
                    <td class="text-center">
                        <input type="checkbox" ng-checked="foodMenu.IsActive" ng-click="confirmActive(foodMenu)" ng-if="policy.permission == 2" />
                        <img class="ico-tick" ng-if="policy.permission == 1 && foodMenu.IsActive" />
                    </td>
                    <td class="text-center" ng-if="policy.permission == 2">
                        <a class="glyphicon glyphicon-edit" href="" title="Edit" ng-click="edit(foodMenu)"></a>
                        <a class="glyphicon glyphicon-remove icon-remove" title="Delete" href="" ng-click="deleteFoodMenu(foodMenu)"></a>
                        <a class="glyphicon glyphicon-eye-open" href="" title="View History"
                           ng-click="viewHistory(foodMenu.MenuId, foodMenu.MenuVnmName, foodMenu.MenuEngName)"></a>
                    </td>
                </tr>

                <tr ng-show="foodMenus.length == 0 || pagedItems.length == 0">
                    <td class="empty-result" colspan="11" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="11" class="paging">
                        <span data-translate="Show"></span>
                        <select class="dropdown-entry" ng-model="entrySelected" ng-change="showEntries()"
                                ng-options="entry for entry in entries"></select>
                        <span data-translate="entries"></span>
                        <pagination-bar></pagination-bar>
                    </td>
                </tr>
            </tfoot>
        </table>
    </div>
