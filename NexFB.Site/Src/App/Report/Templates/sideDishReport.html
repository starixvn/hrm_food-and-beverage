<div class="col-sm-12">
	<div class="row sub-header">
		<ul class="breadcrumb list-inline pull-left">
			<li class="current" data-translate="SideDishReport"></li>
		</ul>
	</div>
	<div class="row filter filterMaxWith">
		<form class="form-horizontal form-multiLine" role="form" action="#">
		<div class="form-group">
			<label class="col-sm-1 text-right long-text-report" data-translate="Department">
			</label>
			<div class="col-sm-2 field">
				<select data-ng-model="criteria.departmentId" data-ng-options="opt.DepartmentId as opt.Name for opt in departments"
					class="form-control" data-ng-change="getTeamAndEmployeeType(criteria.departmentId)">
				</select>
			</div>
			<label class="col-sm-1 text-right long-text-report" data-translate="Team">
			</label>
			<div class="col-sm-2 field">
				<add-class-to-role-filter multi-select input-model="teams" button-label="Name" helper-elements="all reset"
					item-label="Name" tick-property="ticked" max-labels="0" class="multi-select">
				</add-class-to-role-filter>
			</div>
			<label class="col-sm-1 text-right long-text-report" data-translate="EmployeeType">
			</label>
			<div class="col-sm-2 field">
				<add-class-to-role-filter multi-select input-model="employeeTypes" button-label="EmployeeTypeId"
					helper-elements="all reset" item-label="EmployeeTypeName" tick-property="ticked"
					max-labels="0" class="multi-select employee-type">
				</add-class-to-role-filter>
			</div>
		</div>
		<div class="form-group">
			<label class="col-sm-1 text-right long-text-report" data-translate="SideDishItem">
			</label>
			<div class="col-sm-2 field scrollableFilter">
				<add-class-to-role-filter multi-select input-model="sideDishItems" button-label="FoodId"
					helper-elements="all reset" item-label="FoodVnmName" tick-property="ticked" max-labels="0"
					class="multi-select">
				</add-class-to-role-filter>
			</div>
			<label class="col-sm-1 text-right long-text-report" data-translate="From">
			</label>
			<div class="col-sm-2 field daybox">
				<input type="text" class="form-control" data-datepicker-popup="dd MMM, yyyy" data-ng-model="criteria.fromDate"
					data-is-open="fromOpened" data-datepicker-options="fromDateOptions" data-ng-click="open($event,'from')"
					data-show-button-bar="false" />
				<calendar-image class="calendar-image" data-ng-click="open($event,'from')"></calendar-image>
			</div>
			<label class="col-sm-1 text-right long-text-report" data-translate="To">
			</label>
			<div class="col-sm-2 field daybox">
				<input type="text" class="form-control" data-datepicker-popup="dd MMM, yyyy" data-ng-model="criteria.toDate"
					data-is-open="toOpened" data-datepicker-options="toDateOptions" data-ng-click="open($event,'to')"
					data-show-button-bar="false" />
				<calendar-image class="calendar-image" data-ng-click="open($event,'to')"></calendar-image>
			</div>
			<div class="col-sm-1 btn-box">
				<input type="button" value="Submit" class="button" data-ng-click="search()" />
			</div>
		</div>
		</form>
	</div>
	<div id="sideDishReport" class="freegrid" data-side-dish-report>
	</div>
	<br />
</div>
