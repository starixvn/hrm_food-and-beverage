
<div class="col-sm-12">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li class="current" data-translate="MonthlyMainDishReportLocal"></li>
        </ul>
    </div>
    <div class="row filter monthly-per-meal-filter">
        <form class="form-horizontal form-multiLine" role="form">
            <div class="form-group">
                <label class="col-sm-1 text-right" data-translate="Company">
                </label>
                <div class="col-sm-2 field">
                    <select ng-model="filter.companyId" ng-options="opt.CompanyId as opt.Name for opt in companyOptions"
                            class="form-control" ng-change="getTeamAndEmployeeTypeOfCompany(filter.companyId)">
                        <option value="" ng-if="companyOptions.length > 1">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <label class="col-sm-1 text-right long-text-report" data-translate="Team"></label>
                <div class="col-sm-2 field">
                    <add-class-to-role-filter multi-select input-model="teamOptions" button-label="Name" helper-elements="all reset"
                                              item-label="Name" tick-property="ticked" max-labels="0" class="multi-select">
                    </add-class-to-role-filter>
                </div>
                <label class="col-sm-1 text-right" data-translate="Meal"></label>
                <div class="col-sm-2 field">
                    <add-class-to-role-filter multi-select input-model="mealsOption" button-label="MealEngName" helper-elements="all reset"
                                              item-label="MealEngName" tick-property="ticked" max-labels="0" class="multi-select ">
                    </add-class-to-role-filter>
                </div>
                <label class="col-sm-1 text-right admin-history-report" data-translate="Employee">
                </label>
                <div class="col-sm-2 field">
                    <input class="form-control custom-padding" data-ng-model="searchEmployee" placeholder="Enter full name or nick name"
                           data-search-auto-complete data-search-employees="getEmployee()" data-ng-change="unSelectEmployee()"
                           data-employee="filter.employee" data-style="width: 250px;top: 27px;left: 0.28125px;" />
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-1 text-right" data-translate="Month"></label>
                <div class="col-sm-2 field monthbox">
                    <input readonly type="text" class="form-control" datepicker-popup="{{format}}" datepicker-mode="popUpMode" ng-click="open($event)"
                           ng-model="filter.reportDate" is-open="opened" datepicker-options="dateOptions" show-button-bar="false" />
                    <span class="input-group-btn">
                        <button type="button" class="btn btn-default" ng-click="open($event)"><i class="glyphicon glyphicon-calendar"></i></button>
                    </span>
                </div>
                <label class="col-sm-1 text-right long-text-report" data-translate="EmployeeType"></label>
                <div class="col-sm-2 field">
                    <add-class-to-role-filter multi-select input-model="employeeTypesOption" button-label="EmployeeTypeId" helper-elements="all reset"
                                              item-label="EmployeeTypeName" tick-property="ticked" max-labels="0" class="multi-select employee-type">
                    </add-class-to-role-filter>
                </div>
                <label class="col-sm-1 text-right" data-translate="GroupBy"></label>
                <div class="col-sm-2 field">
                    <select ng-model="filter.groupBy" class="form-control">
                        <option data-translate="Employee" value="0"></option>
                        <option data-translate="Company" value="1"></option>
                        <option data-translate="CostCenter" value="2"></option>
                    </select>
                </div>
                <div class="col-sm-1 btn-box">
                    <input type="button" value="Submit" class="button ml-btn-submit" ng-click="query(filter)" reset-scroll />
                </div>
            </div>
        </form>
    </div>
    <div id="monthlyReport" class="freegrid" render-monthly-report export-monthly-main-dish-local-report></div>
</div>
