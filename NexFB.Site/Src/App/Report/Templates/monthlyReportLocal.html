
<div class="col-sm-12">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
			<li class="current" data-translate="MonthlyMainDishReportLocal"></li>
        </ul>
    </div>
    <div class="row filter">
        <form class="form-horizontal form-multiLine" role="form">
			<div class="form-group">
				<label class="col-sm-1 text-right" data-translate="Department">
				</label>
                <div class="col-sm-2 field">
                    <select ng-model="filter.departmentId" ng-options="opt.DepartmentId as opt.Name for opt in departmentOptions"
					    class="form-control" ng-change="getTeamByCompany(filter.departmentId)">
					    <option value="">-- {{"All" | translate}} --</option>
				    </select>
                </div>
                <label class="col-sm-1 text-right long-text-report"  data-translate="Team"></label>
                <div class="col-sm-2 field teambox">
                      <add-class-to-role-filter multi-select input-model="teamOptions" button-label="Name" helper-elements="all reset"
					    item-label="Name" tick-property="ticked" max-labels="0" class="multi-select">
				    </add-class-to-role-filter>
                </div>
                <label class="col-sm-1 text-right" data-translate="Meal"></label>
                <div class="col-sm-2 field">
                    <add-class-to-role-filter multi-select input-model="mealsOption" button-label="MealEngName" helper-elements="all reset"
					    item-label="MealEngName" tick-property="ticked" max-labels="0" class="multi-select ">
				    </add-class-to-role-filter>
                </div>
			</div>
            <div class="form-group">
                <label class="col-sm-1 text-right">Month</label>
                <div class="col-sm-2 field monthbox">
                    <input readonly type="text" class="form-control" datepicker-popup="{{format}}" datepicker-mode="popUpMode" ng-click="open($event)" 
					ng-model="filter.reportDate" is-open="opened" datepicker-options="dateOptions" show-button-bar="false"/>
				    <span class="input-group-btn">
					    <button type="button" class="btn btn-default" ng-click="open($event)"><i class="glyphicon glyphicon-calendar"></i></button>
				    </span>
                </div>
                <label class="col-sm-1 text-right long-text-report" data-translate="EmployeeType"></label>
                <div class="col-sm-2 field">
                    <add-class-to-role-filter multi-select input-model="employeeTypesOption" button-label="EmployeeTypeId" helper-elements="all reset"
					    item-label="EmployeeTypeName" tick-property="ticked" max-labels="0" class="multi-select employee-type">
				    </add-class-to-role-filter>
                </div>
                <label class="col-sm-1 text-right" data-translate="GroupBy"></label>
                <div class="col-sm-2 field">
                    <select ng-model="filter.groupBy" class="form-control" >
					    <option data-translate="Employee" value="0"></option>
					    <option data-translate="Department" value="1"></option>
				    </select>
                </div>
                <div class="col-sm-1 btn-box">
                     <input type="button" value="Submit" class="button" ng-click="query(filter)"/>
                </div>
            </div>
        </form>
    </div>
    <div class="row table-menu">
			<table st-table="localReport" class="table table-bordered table-striped tbl-report">
				<thead>
					<tr>
						<th data-translate="SymbolCount" rowspan="2" ></th>
						<th data-translate="NickName" rowspan="2" ng-show="localReport.IsGroupByEmployee" ></th>
						<th data-translate="EmployeeType" rowspan="2" ng-show="localReport.IsGroupByEmployee" ></th>
						<th data-translate="DepartmentSection" rowspan="2" ></th>
						<th colspan="31" ng-bind="localReport.Month"></th>
						<th colspan="2" data-translate="Total"></th>
					</tr>
				<tr class="date">
						<th ng-repeat="day in localReport.WeekDays.NumberMeals track by $index" ng-bind="$index + 1">
						</th>
						<th data-translate="Qty"></th>
						<th data-translate="Amount"></th>
					</tr>
				</thead>
				<tbody ng-repeat="meal in localReport.Meals">
					<tr>
						<td colspan="37" ng-bind="meal.Meal.MealEngName"></td>
					</tr>
					<tr ng-repeat="mealItem in meal.MealItems">
						<td ng-bind="$index + 1">
						</td>
						<td ng-bind="mealItem.Employee.NickName" ng-show="localReport.IsGroupByEmployee">
						</td>
						<td ng-bind="mealItem.EmployeeType.EmployeeTypeName" ng-show="localReport.IsGroupByEmployee">
						</td>
						<td>{{mealItem.Department.Name + ' > ' + mealItem.Team.Name}}
						</td>
						<td ng-repeat="dayMeal in mealItem.NumberMealsMonth.NumberMeals track by $index" ng-bind="dayMeal">
						</td>
						<td ng-bind="mealItem.NumberMealsMonth.TotalQuantity">
						</td>
						<td ng-bind="mealItem.NumberMealsMonth.Amount">
						</td>
					</tr>
				</tbody>
				<tbody>
					<tr>
						<td colspan="4" data-translate="Total" ng-show="localReport.IsGroupByEmployee">
						</td>
						<td colspan="2" data-translate="Total" ng-show="!localReport.IsGroupByEmployee">
						</td>
						<td ng-repeat="totalDayMeal in localReport.Total.NumberMeals track by $index" ng-bind="totalDayMeal">
						</td>
						<td ng-bind="localReport.Total.TotalQuantity">
						</td>
						<td ng-bind="localReport.Total.Amount">
						</td>
					</tr>
				</tbody>
			</table>
    </div>
</div>
