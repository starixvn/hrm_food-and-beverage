<div class="col-sm-12">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li class="current" data-translate="MealForecastReport"></li>
        </ul>
    </div>
    <div class="row filter">
        <form class="form-horizontal form-multiLine" role="form">
        <div class="form-group">
            <label class="col-sm-1 text-right" data-translate="Department">
            </label>
            <div class="col-sm-2 field">
                <select ng-model="filter.departmentId" ng-options="opt.DepartmentId as opt.Name for opt in departmentOptions"
                    class="form-control">
                    <option value="" ng-if="departmentOptions.length > 1">-- {{"All" | translate}} --</option>
                </select>
            </div>
            <label class="col-sm-1 text-right" data-translate="DietType">
            </label>
            <div class="col-sm-2 field">
                <select ng-model="filter.vegetarianType" class="form-control">
                    <option value="">-- {{"All" | translate}} --</option>
                    <option value="1">{{"Vegetarian" | translate}}</option>
                    <option value="0">{{"Non-Vegetarian" | translate}}</option>
                </select>
            </div>
            <div class="col-sm-1 btn-box">
                <input type="button" value="Submit" class="button" ng-click="query(filter)" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-1 text-right" data-translate="From">
            </label>
            <div class="col-sm-2 field">
                <input readonly class="calendar-form-control" type="text" ng-model="filter.fromDate"
                    datepicker-popup is-open="calendar.startDateOpened" ng-click="openPopupStartDate($event)" />
                <calendar-image class="calendar-image" ng-click="openPopupStartDate($event)"></calendar-image>
            </div>
            <label class="col-sm-1 text-right" data-translate="To">
            </label>
            <div class="col-sm-2 field">
                <input readonly class="calendar-form-control" type="text" ng-model="filter.toDate"
                    datepicker-popup is-open="calendar.endDateOpened" ng-click="openPopupEndDate($event)" />
                <calendar-image class="calendar-image" ng-click="openPopupEndDate($event)"></calendar-image>
            </div>
        </div>
        </form>
    </div>
    <div id="mealForecastReport" class="freegrid" render-meal-forecast-report export-meal-forecast-report>
    </div>
</div>
