<div>
	<div class="modal-header">
		<div class="popup-header">
			{{"CreateFoodItem" | translate}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body food-item-body-modal">
         <form novalidate class="form-inline form-fooditem" role="form" name="form" ng-init="setFormScope(this)">
            <div class="form-group required">
                <label class="control-label" data-translate="FoodItemVnm"></label>
                <input type="text" class="form-control" maxlength="300" ng-model="food.foodVnmName" />
            </div>
            <div class="form-group required">
                <label class="control-label" data-translate="FoodEngName"></label>
                <input type="text" class="form-control" maxlength="300" ng-model="food.foodEngName" />
            </div>
            <div class="form-group">
                <label class="checkbox"><input type="checkbox" ng-model="food.isActive"/> {{"Active" | translate}}</label>
            </div>
			<div class="form-group required">
				<label class="control-label" data-translate="FoodCode"></label>
				<input type="text" class="form-control" maxlength="300" ng-model="food.foodCode" />
			</div>
        </form>
        <div class="food-item">
            <div>{{"SetMenu" | translate}}</div>
			<div class="menu-box">
				<select name="setMenuSelect" class="chosen-select" data-placeholder="Select the set menu" multiple multi-select-chosen name="setMenuGroup"
					ng-model="food.setMenuIds" ng-options="opt.SetMenuId as opt.SetMenuVnmName for opt in setMenuItems">
				</select>
			</div>
        </div>
	</div>
	<div class="modal-footer">
		<button class="button" data-translate="Submit" ng-click="create(food)" ng-disabled="disabledSubmitButton">
		</button>
		<button class="button" data-translate="SubmitContinue" reset-food-item ng-click="createAndContinue(food)" ng-disabled="disabledSubmitButton">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
