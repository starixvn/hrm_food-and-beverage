<div>
	<div class="modal-header">
		<div class="popup-header">
			{{"CreateFoodItem" | translate}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body assign-role-modal">
         <form novalidate class="form-inline form-fooditem" role="form" name="form">
            <div class="form-group">
                <label data-translate="FoodItemVnmName"></label>
                <input type="text" class="form-control" ng-model="food.foodVnmName" name="vnmName" required />
            </div>
            <div class="form-group">
                <label data-translate="FoodItemEngName"></label>
                <input type="text" class="form-control" ng-model="food.foodEngName" name="engName" required />
            </div>
            <div class="form-group">
                <label>{{"Active" | translate}}:</label>
                <input type="checkbox" ng-model="food.isActive"/>
            </div>
        </form>
        <div>
            <div>{{"Menu" | translate}}:</div>
			<div class="col-sm-10">
				<select name="menuSelect" class="chosen-select" data-placeholder="Select the menu group" multiple multi-select-chosen name="foodMenuGroup"
					ng-model="food.groupIds" ng-options="opt.MenuId as opt.MenuVnmName for opt in groupOptions">
				</select>
			</div>
        </div>
	</div>

	<div class="modal-footer">
		<button class="button" data-translate="Submit" ng-click="create(food)" ng-disabled="disabledSubmitButton">
		</button>
		<button class="button" reset-food-item data-translate="SubmitContinue" ng-disabled="disabledSubmitButton">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
