<div>
	<div class="modal-header">
		<div class="popup-header">
			{{"CreateFoodItem" | translate}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body assign-role-modal">
         <form class="form-inline form-fooditem" role="form">
            <div class="form-group">
                <label>Food item (Vie)</label>
                <input type="text" class="form-control" ng-model="food.foodVnmName"/>
            </div>
            <div class="form-group">
                <label>(Eng)</label>
                <input type="text" class="form-control" ng-model="food.foodEngName"/>
            </div>
            <div class="form-group">
                <label>{{"Active" | translate}}:</label>
                <input type="checkbox" ng-model="food.isActive"/>
            </div>
        </form>
        <div>
            <div>{{"Menu" | translate}}:</div>
			<div class="col-sm-10">
				<select class="chosen-select" data-placeholder="Select the menu group" multiple multi-select-chosen name="foodMenuGroup"
					ng-model="food.MenuGroupId" ng-options="opt.MenuId as opt.MenuVnmName for opt in groupOptions">
				</select>
			</div>
        </div>
	</div>

	<div class="modal-footer">
		<button class="button" data-translate="Submit">
		</button>
		<button class="button" data-translate="SubmitContinue">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
