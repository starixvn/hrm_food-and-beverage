<div>
	<div class="modal-header">
		<div class="popup-header">
			{{"EditFoodItem" | translate}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body assign-role-modal">
        <form class="form-inline form-fooditem" role="form">
            <div class="form-group">
                <label>Food item (Vie)</label>
                <input type="text" class="form-control" />
            </div>
            <div class="form-group">
                <label>(Eng)</label>
                <input type="text" class="form-control"/>
            </div>
            <div class="form-group">
                <label>Active:</label>
                <input type="checkbox" checked="checked"/>
            </div>
        </form>
        <div class="menu-box">
            <div>Menu:</div>
        </div>
	</div>

	<div class="modal-footer">
		<button class="button" get-meal-registration data-translate="Submit">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
