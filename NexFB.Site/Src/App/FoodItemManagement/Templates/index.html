<div class="col-sm-10">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
			<li class="current" data-translate="FoodItemManagement"></li>
        </ul>
        <a class="button-icon" ng-click="addFoodItem()" ng-if="policy.permission == 2">
            <span class="icon plus"></span>
            <span class="button-text" data-translate="CreateFoodItem"></span>
        </a>
    </div>
    <div class="row filter">
        <form class="form-inline" role="form">
            <div class="form-group" name="multiSelectOption">
                <label data-translate="Menu"></label>
				<add-class-to-role-filter multi-select input-model="menuOptions" button-label="MenuVnmName"
					item-label="MenuVnmName MenuEngMaker" tick-property="ticked" max-labels="0" class="multi-select">
				</add-class-to-role-filter>
            </div>
            <div class="form-group">
                <label data-translate="Status"></label>
                <select ng-model="filter.isActive">
                    <option selected value="" data-translate="AllStatuses"></option>
                    <option value="true" data-translate="Active"></option>
                    <option value="false" data-translate="InActive"></option>
                </select>
            </div>
            <div class="form-group">
				<button class="button" ng-click="query(filter)" data-translate="Submit">
				</button>
            </div>
        </form>
    </div>
    <div class="row table-fooditem">
        <table class="table table-bordered table-striped col-sm-12">
            <thead>
				<tr class="header-table">
					<th colspan="6" ng-show="policy.permission == 2">
						<div class="pull-left table-entries">
							<span data-translate="Show"></span>
							<select class="dropdown-entry" ng-model="entrySelected" ng-change="showEntries()"
								ng-options="entry for entry in entries">
							</select>
							<span data-translate="entries"></span>
						</div>
						<input type="text" ng-model="queryData" ng-change="search()" class="search-inline-textbox search pull-right">
					</th>
					<th colspan="5" ng-show="policy.permission == 1">
						<div class="pull-left table-entries">
							<span data-translate="Show"></span>
							<select class="dropdown-entry" ng-model="entrySelected" ng-change="showEntries()"
								ng-options="entry for entry in entries">
							</select>
							<span data-translate="entries"></span>
						</div>
						<input type="text" ng-model="queryData" ng-change="search()" class="search-inline-textbox search pull-right">
					</th>
				</tr>
                <tr>
                    <th data-translate="SymbolCount"></th>
                    <th data-translate="FoodItemVnm"></th>
                    <th data-translate="FoodItemEng"></th>
                    <th data-translate="Menu"></th>
                    <th class="width-60" data-translate="Active"></th>
                    <th class="width-60" data-translate="Action" ng-if="policy.permission == 2"></th>
                </tr>
            </thead>
			<tbody>
				<tr ng-repeat="food in pagedItems[currentPage] track by food.FoodId">
					<td class="text-center" ng-bind="$index + 1"></td>
					<td ng-bind="food.FoodVnmName"></td>
					<td ng-bind="food.FoodEngName"></td>
					<td>
						<div ng-show="food.FoodMenus.length == 1">
							<span ng-bind="food.FoodMenus[0].MenuVnmName + ' (' + food.FoodMenus[0].MenuEngName + ')'"></span>
						</div>
						<div ng-show="food.FoodMenus.length > 1">
							<ul class="group-toggle-item">
								<li ng-repeat="menuGroup in food.FoodMenus" ng-bind="menuGroup.MenuVnmName + ' (' + menuGroup.MenuEngName + ')'"></li>
							</ul>
						</div>
					</td>
					<td class="text-center">
						<input type="checkbox" ng-checked="food.IsActive" ng-click="confirmActive(food)" ng-if="policy.permission == 2"/>
						<img class="ico-tick" ng-if="policy.permission == 1 && food.IsActive" />
					</td>
 					<td class="text-center" ng-if="policy.permission == 2">
						<a class="glyphicon glyphicon-edit" href="" ng-click="edit(food)"></a>
						<a class="glyphicon glyphicon-remove icon-remove" href="" ng-click="deleteFoodItem(food)"></a>
					</td>
				</tr>
				<tr ng-show="foodItems.length == 0">
					<td class="empty-result" colspan="6" data-translate="EmptyResult" ng-if="policy.permission == 2">
					</td>
					<td class="empty-result" colspan="5" data-translate="EmptyResult" ng-if="policy.permission == 1">
					</td>
				</tr>
			</tbody>
			<tfoot>
				<tr>
					<td colspan="6" class="paging" >
						<pagination-bar></pagination-bar>
					</td>
				</tr>
			</tfoot>
        </table>
    </div>
</div>
