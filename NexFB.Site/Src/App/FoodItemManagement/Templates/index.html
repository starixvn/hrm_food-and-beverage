<div class="col-sm-10">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li class="current">Food item management</li>
        </ul>
    </div>
    <div class="row filter">
        <form class="form-inline" role="form">
            <div class="form-group">
                <label>Menu</label>
                <select>
                    <option value="0">5 selected</option>
                </select>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select>
                    <option value="0">All Statuses</option>
                    <option value="1">Active</option>
                    <option value="2">UnActive</option>
                </select>
            </div>
            <div class="form-group">
                <input type="button" value="Submit" class="button"/>
            </div>
        </form>
    </div>
    <div class="row pull-right ">
        <input type="button" value="Create food item" class="button" ng-click="addFoodItem()"/>
    </div>
    <div class="row table-fooditem">
        <table class="table table-bordered table-striped col-sm-12">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Food item (Vietnamese)</th>
                    <th>Food item (English)</th>
                    <th>Menu</th>
                    <th class="width-60">Active</th>
                    <th class="width-80">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="text-center">1</td>
                    <td>Bánh mì ốp la</td>
                    <td>English name</td>
                    <td>- Breakfast 1</td>
                    <td class="text-center"><input type="checkbox" checked="checked"/></td>
                    <td class="text-center">
                        <a class="glyphicon glyphicon-edit" href="" ng-click="edit()"></a>
                        <a class="glyphicon glyphicon-remove icon-remove" href=""></a>
                    </td>
                </tr>
                <tr>
                    <td class="text-center">2</td>
                    <td>Bún mọc</td>
                    <td>English name</td>
                    <td>- Breakfast 1</td>
                    <td class="text-center"><input type="checkbox" checked="checked"/></td>
                    <td class="text-center">
                        <a class="glyphicon glyphicon-edit" href="" ng-click="edit()"></a>
                        <a class="glyphicon glyphicon-remove icon-remove" href=""></a>
                    </td>
                </tr>
                <tr>
                    <td class="text-center">3</td>
                    <td>Cơm tấm</td>
                    <td>English name</td>
                    <td>
                        <div>- Breakfast 1</div>
                        <div>- Lunch 1</div>
                        <div>- Dinner</div>
                    </td>
                    <td class="text-center"><input type="checkbox" checked="checked"/></td>
                    <td class="text-center">
                        <a class="glyphicon glyphicon-edit" href="" ng-click="edit()"></a>
                        <a class="glyphicon glyphicon-remove icon-remove" href=""></a>
                    </td>
                </tr>
                <tr>
                    <td class="text-center">3</td>
                    <td>Thịt kho trứng</td>
                    <td>English name</td>
                    <td>
                        - Lunch 2
                    </td>
                    <td class="text-center"><input type="checkbox" checked="checked"/></td>
                    <td class="text-center">
                        <a class="glyphicon glyphicon-edit" href="" ng-click="edit()"></a>
                        <a class="glyphicon glyphicon-remove icon-remove" href=""></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
