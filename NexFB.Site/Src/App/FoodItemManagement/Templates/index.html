<div class="col-sm-10">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
			<li class="current"><a href="#" data-translate="FoodItemManagement" ng-click="reload()"></a></li>
			<li class="current" data-translate="ManageFoodItem"></li>
        </ul>
    </div>
    <div class="row filter">
        <form class="form-inline" role="form">
            <div class="form-group">
                <label data-translate="Menu"></label>
                <select>
                    <option value="0">5 selected</option>
                </select>
            </div>
            <div class="form-group">
                <label data-translate="Status"></label>
                <select>
                    <option value="0">All Statuses</option>
                    <option value="1">Active</option>
                    <option value="2">UnActive</option>
                </select>
            </div>
            <div class="form-group">
                <input type="button" value="Submit" class="button"/>
            </div>
        </form>
    </div>
    <div class="row pull-right ">
        <input type="button" value="Create food item" class="button" ng-click="addFoodItem()"/>
    </div>
    <div class="row table-fooditem">
        <table class="table table-bordered table-striped col-sm-12">
            <thead>
                <tr>
                    <th data-translate="SymbolCount"></th>
                    <th data-translate="FoodItemVnm"></th>
                    <th data-translate="FoodItemEng"></th>
                    <th data-translate="Menu"></th>
                    <th class="width-60" data-translate="Active"></th>
                    <th class="width-80" data-translate="Action"></th>
                </tr>
            </thead>
			<tbody>
				<tr ng-repeat="food in foodItems">
					<td class="text-center" ng-bind="$index + 1"></td>
					<td ng-bind="food.FoodVnmName"></td>
					<td ng-bind="food.FoodEngName"></td>
					<td></td>
					<td class="text-center">
						<input type="checkbox" ng-checked="food.IsActive"/>
					</td>
					<td class="text-center">
						<a class="glyphicon glyphicon-edit" href="" ng-click="edit()"></a>
						<a class="glyphicon glyphicon-remove icon-remove" href=""></a>
					</td>
				</tr>
			</tbody>
        </table>
    </div>
</div>
