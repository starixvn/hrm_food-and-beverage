<div class="modal-header">
    <div class="popup-header">
        {{"CreateDeliveryArea" | translate}}<span class="close-popup" ng-click="cancel()"></span>
    </div>
</div>
<div class="modal-body alt-menu-body-modal">
    <form class="form-horizontal col-sm-11" role="form">
		<div class="form-group required">
			<label class="col-sm-4 control-label" data-translate="DeliveryAreaViet">
			</label>
			<div class="col-sm-8 field">
				<input type="text" class="form-control" ng-model="deliveryArea.NameVN" required maxlength="40" />
			</div>
		</div>
		<div class="form-group required">
			<label class="col-sm-4 control-label" data-translate="DeliveryAreaEng">
			</label>
			<div class="col-sm-8 field">
				<input type="text" class="form-control" ng-model="deliveryArea.NameEN" required maxlength="40" />
			</div>
		</div>
		<div class="form-group required">
			<label class="col-sm-4 control-label" data-translate="Floor">
			</label>
			<div class="col-sm-8 field">
				<input type="text" class="form-control" ng-model="deliveryArea.FloorName" required maxlength="5" />
			</div>
		</div>
		<div class="form-group">
			<label class="col-sm-4 control-label side-dish-active-label" data-translate="Active">
			</label>
			<div class="col-sm-8 field side-dish-active-div">
				<input type="checkbox" ng-model="deliveryArea.isActive" />
			</div>
		</div>
    </form>
</div>
<div class="modal-footer">
    <button class="button" data-translate="Submit" ng-click="save(deliveryArea)" ng-disabled="disabledSubmitButton">
    </button>
    <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
    </button>
</div>
