 <div>
	<div class="modal-header">
		<div class="popup-header">
			{{"ResetPassword" | translate}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body">
        {{"ConfirmResetPassword" | translate}}

		</button>
	</div>
</div>
