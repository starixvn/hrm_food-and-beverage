 <div>
	<div class="modal-header">
		<div class="popup-header">
			{{"ResetPassword" | translate}}
            <span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body">
        Are you sure you want to reset password of <b>{{nickName}}</b> to <b>{{defaultPassword}}</b>?
	</div>

	<div class="modal-footer">
		<button class="button" ng-click='save()' data-translate="Reset">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
