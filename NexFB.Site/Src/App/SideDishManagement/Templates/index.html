<div class="col-sm-12">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
			<li class="current" data-translate="SideDishManagement"></li>
        </ul>
    </div>
    <div class="row table-menu">
        <table class="table table-bordered table-striped col-sm-12">
            <thead>
				<tr class="header-table">
					<th colspan="9" ng-show="policy.permission == 2">
						<a class="pull-left button-icon create-button" ng-click="addSideDish()" >
							<span class="icon plus"></span>
							<span class="button-text" data-translate="CreateSideDish"></span>
						</a>
						<input type="text" ng-model="queryData" ng-change="search()" class="search-inline-textbox search pull-right">
					</th>
					<th colspan="8" ng-show="policy.permission == 1">
						<input type="text" ng-model="queryData" ng-change="search()" class="search-inline-textbox search pull-right">
					</th>
				</tr>
                <tr>
                    <th data-translate="SymbolCount"></th>
                    <th data-translate="Code"></th>
                    <th data-translate="FoodItemVnm"></th>
					<th data-translate="FoodItemEng"></th>
                    <th data-translate="Unit"></th>
                    <th data-translate="Price"></th>
                    <th class="width-120" data-translate="EmployeeType"></th>
                    <th class="width-60" data-translate="Active"></th>
                    <th class="width-80" data-translate="Action" ng-if="policy.permission == 2"></th>
                </tr>
            </thead>
            <tbody>
				<tr ng-repeat="sideDish in pagedItems[currentPage] track by sideDish.FoodId">
					<td class="text-center" ng-bind="sideDish.itemIndex + 1">
					</td>
					<td class="text-center" ng-bind="sideDish.FoodCode">
					</td>
					<td ng-bind="sideDish.FoodVnmName">
					</td>
					<td ng-bind="sideDish.FoodEngName">
					</td>
					<td class="text-center" ng-bind="sideDish.Unit.UnitVnmName">
					</td>
					<td class="text-right" ng-bind="sideDish.Price | number">
					</td>
					<td>
						<div ng-if="sideDish.EmployeeTypes.length == 1">
							<span ng-bind="sideDish.EmployeeTypes[0].EmployeeTypeName"></span>
						</div>
						<div ng-if="sideDish.EmployeeTypes.length > 1">
							<ul class="group-toggle-item">
								<li ng-repeat="type in sideDish.EmployeeTypes" ng-bind="type.EmployeeTypeName"></li>
							</ul>
						</div>
					</td>
					<td class="text-center">
						<input type="checkbox" ng-checked="sideDish.IsActive" ng-click="confirmActive(sideDish)" ng-if="policy.permission == 2"/>
						<img class="ico-tick" ng-if="policy.permission == 1 && sideDish.IsActive" />
					</td>
					<td class="text-center" ng-if="policy.permission == 2" >
						<a class="glyphicon glyphicon-edit" href="" ng-click="editSideDish(sideDish)"></a>
						<a class="glyphicon glyphicon-remove icon-remove" href="" ng-click="deleteSideDish(sideDish)"></a>
					</td>
				</tr>
				<tr ng-show="sideDishes.length == 0 || pagedItems.length == 0">
					<td class="empty-result" colspan="8" data-translate="EmptyResult">
					</td>
				</tr>
            </tbody>
			<tfoot>
				<tr>
					<td colspan="9" class="paging" >
						<span data-translate="Show"></span>
						<select class="dropdown-entry" ng-model="entrySelected" ng-change="showEntries()"
							ng-options="entry for entry in entries">
						</select>
						<span data-translate="entries"></span>
						<pagination-bar></pagination-bar>
					</td>
				</tr>
			</tfoot>
        </table>
    </div>
