<div class="modal-header">
    <div class="popup-header">
        {{"CreateSideDish" | translate}}<span class="close-popup" ng-click="cancel()"></span>
    </div>
</div>
<div class="modal-body side-dish-body-modal">
    <form class="form-horizontal form-menuManagement col-sm-11" role="form">
    <div class="form-group">
        <label class="col-sm-3 text-right" data-translate="Code">
        </label>
        <div class="col-sm-9 field">
            <input type="text" class="form-control" ng-model="sideDish.foodCode" required />
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 text-right" data-translate="FoodItem">
        </label>
        <div class="col-sm-9 field">
            <input type="text" class="form-control" ng-model="sideDish.foodVnmName" required />
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 text-right " data-translate="Unit">
        </label>
        <div class="col-sm-9 field">
            <select ng-model="sideDish.unitId" ng-options="opt.UnitId as opt.UnitVnmName for opt in unitOptions"
                required class="form-control">
                <option value="">-- {{"SelectUnit" | translate}} --</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 text-right" data-translate="Price">
        </label>
        <div class="col-sm-9 field">
            <input type="text" class="form-control" ng-model="sideDish.price" number-only="number"
                required />
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 text-right" data-translate="EmployeeType">
        </label>
        <div class="col-sm-9 field selectbox">
            <add-class-to-role-filter multi-select input-model="employeeTypesOption" button-label="EmployeeTypeId"
                helper-elements="all reset" item-label="EmployeeTypeName" tick-property="ticked"
                max-labels="0" class="multi-select employee-type">
					</add-class-to-role-filter>
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 text-right" data-translate="Active">
        </label>
        <div class="col-sm-8 field">
            <input type="checkbox" ng-model="sideDish.isActive" />
        </div>
    </div>
    </form>
</div>
<div class="modal-footer">
    <button class="button" data-translate="Submit" ng-click="save(sideDish)" ng-disabled="disabledSubmitButton">
    </button>
    <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
    </button>
</div>
