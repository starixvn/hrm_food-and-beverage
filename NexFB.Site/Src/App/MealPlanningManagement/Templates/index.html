<div class="col-sm-12">
    <div class="row filter">
        <form class="form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-1 text-right" data-translate="Meal"></label>
                <div class="col-sm-2">
					<select ng-model="filter.mealId" ng-options="opt.MealId as opt.MealEngName for opt in mealsOption"
						required class="form-control">
						<option value="">-- {{"AllMeals" | translate}} --</option>
					</select>
                </div>
                <label class="col-sm-2 text-right" data-translate="EmployeeType"></label>
                <div class="col-sm-2">
 					<select ng-model="filter.employeeTypeId" ng-options="opt.EmployeeTypeId as opt.EmployeeTypeName for opt in employeeTypesOption"
						required class="form-control">
						<option value="">-- {{"AllType" | translate}} --</option>
					</select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-1 text-right" data-translate="From"></label>
                <div class="col-sm-2">
					<input class="calendar-form-control" type="text" ng-model="filter.startDate" datepicker-popup="{{dateFormat}}"
						is-open="calendar.startDateOpened" />
					<calendar-image class="calendar-image" ng-click="openPopupStartDate($event)"></calendar-image>
                </div>
                <label class="col-sm-2 text-right" data-translate="To"></label>
                <div class="col-sm-2">
                    <input type="text" class="form-control"/>
                </div>
                <div class="col-ofset-sm-2">
                    <input type="button" class="button" value="Submit"/>
                </div>
            </div>
        </form>
    </div>
    <div class="row table-mealPlanning">
        <table class="table table-bordered table-striped col-sm-12">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Menu (Vie)</th>
                    <th>Date</th>
                    <th class="width-150">Meal</th>
                    <th class="width-60">Veg.</th>
                    <th class="">Employee type</th>
                    <th class="width-300">Food item</th>
                    <th class="width-60">Active</th>
                    <th class="width-80">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="mealPlanning in pagedItems[currentPage]">
                    <td rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center oddRow" ng-bind="mealPlanning.itemIndex + 1"></td>
                    <td rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="oddRow" ng-bind="mealPlanning.FoodMenu.MenuVnmName"></td>
                    <td rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="oddRow" ng-bind="mealPlanning.Date | customDate"></td>
                    <td rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="oddRow">
						<div ng-if="mealPlanning.FoodMenu.Meals.length == 1" >
							<span ng-bind="foodMenu.Meals[0].MealEngName"></span>
						</div>
						<div ng-if="mealPlanning.FoodMenu.Meals.length > 1" >
							<ul class="group-toggle-item">
								<li ng-repeat="meal in mealPlanning.FoodMenu.Meals" ng-bind="meal.MealEngName"></li>
							</ul>
						</div>
					</td>
					<td rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center">
						<span data-translate="Yes" ng-if="mealPlanning.FoodMenu.IsVegetarian"></span>
						<span data-translate="No" ng-if="!mealPlanning.FoodMenu.IsVegetarian"></span>
					</td>
					<td rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="oddRow">
						<div ng-if="mealPlanning.FoodMenu.EmployeeTypes.length == 1">
							<span ng-bind="foodMenu.EmployeeTypes[0].EmployeeTypeName"></span>
						</div>
						<div ng-if="mealPlanning.FoodMenu.EmployeeTypes.length > 1">
							<ul class="group-toggle-item">
								<li ng-repeat="type in mealPlanning.FoodMenu.EmployeeTypes" ng-bind="type.EmployeeTypeName"></li>
							</ul>
						</div>
					</td>
                    <td class="oddRow">
						
					</td>
                    <td rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center oddRow">
						<input type="checkbox" ng-checked="mealPlanning.IsActive" />
					</td>
                    <td rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center oddRow">
                        <a class="glyphicon glyphicon-edit" href="" ng-click="edit()"></a>
                        <a class="glyphicon glyphicon-remove icon-remove" href=""></a>
                    </td>
