<div class="col-sm-12">
	<div class="row sub-header">
		<ul class="breadcrumb list-inline pull-left">
			<li class="current" data-translate="MealPlanningManagement"></li>
		</ul>
	</div>
	<div class="row filter">
		<form class="form-horizontal" role="form">
			<div class="form-group">
				<label class="col-sm-1 text-right" data-translate="Meal"></label>
				<div class="col-sm-2 field selectbox">
					<add-class-to-role-filter multi-select input-model="mealsOption" button-label="MealEngName" helper-elements="all reset"
						item-label="MealEngName" tick-property="ticked" max-labels="0" class="multi-select ">
					</add-class-to-role-filter>
				</div>
				<label class="col-sm-2 text-right" data-translate="EmployeeType"></label>
				<div class="col-sm-2 field selectbox">
					<add-class-to-role-filter multi-select input-model="employeeTypesOption" button-label="EmployeeTypeId" helper-elements="all reset"
						item-label="EmployeeTypeName" tick-property="ticked" max-labels="0" class="multi-select employee-type">
					</add-class-to-role-filter>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-1 text-right" data-translate="From"></label>
				<div class="col-sm-2">
					<input class="calendar-form-control" type="text" ng-model="filter.startDate" datepicker-popup
						is-open="calendar.startDateOpened" ng-click="calendar.startDateOpened=true" />
					<calendar-image class="calendar-image" ng-click="openPopupStartDate($event)"></calendar-image>
				</div>
				<label class="col-sm-2 text-right" data-translate="To"></label>
				<div class="col-sm-2">
					<input class="calendar-form-control" type="text" ng-model="filter.endDate" datepicker-popup
						is-open="calendar.endDateOpened" ng-click="calendar.endDateOpened=true" />
					<calendar-image class="calendar-image" ng-click="openPopupEndDate($event)"></calendar-image>
				</div>
				<div class="col-ofset-sm-2">
					<input type="button" class="button" value="Submit" ng-click="query(filter)" />
				</div>
			</div>
		</form>
	</div>
	<div class="row table-mealPlanning">
		<table class="table table-bordered table-striped col-sm-12">
			<thead>
				<tr class="header-table">
					<th colspan="9" >
						<input type="text" ng-model="queryData" ng-change="search()" class="search-inline-textbox search pull-right">
					</th>
				</tr>
				<tr>
					<th data-translate="SymbolCount"></th>
					<th data-translate="FoodMenuVnm"></th>
					<th data-translate="Date"></th>
					<th class="width-150" data-translate="Meal"></th>
					<th class="width-60">{{"ShortVegetarian" | translate}}.</th>
					<th class="" data-translate="EmployeeType"></th>
					<th class="width-300" data-translate="FoodItem"></th>
					<th class="width-60" data-translate="Active"></th>
					<th class="width-80" data-translate="Action"></th>
				</tr>
			</thead>
			<tbody ng-repeat="mealPlanning in pagedItems[currentPage]">
				<tr ng-repeat="food in mealPlanning.FoodMenu.FoodItems" ng-show="mealPlanning.FoodMenu.FoodItems.length > 0" >
					<td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}" 
						ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center" ng-bind="mealPlanning.itemIndex + 1"></td>
					<td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}" 
						ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" ng-bind="mealPlanning.FoodMenu.MenuVnmName"></td>
					<td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}" 
						ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" ng-bind="mealPlanning.Date | customDate"></td>
					<td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}" 
						ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" >
						<div ng-if="mealPlanning.FoodMenu.Meals.length == 1" >
							<span ng-bind="mealPlanning.FoodMenu.Meals[0].MealEngName"></span>
						</div>
						<div ng-if="mealPlanning.FoodMenu.Meals.length > 1" >
							<ul class="group-toggle-item">
								<li ng-repeat="meal in mealPlanning.FoodMenu.Meals" ng-bind="meal.MealEngName"></li>
							</ul>
						</div>
					</td>
					<td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}" 
						ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center">
						<span data-translate="Yes" ng-if="mealPlanning.FoodMenu.IsVegetarian"></span>
						<span data-translate="No" ng-if="!mealPlanning.FoodMenu.IsVegetarian"></span>
					</td>
					<td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}" 
						ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" >
						<div ng-if="mealPlanning.FoodMenu.EmployeeTypes.length == 1">
							<span ng-bind="mealPlanning.FoodMenu.EmployeeTypes[0].EmployeeTypeName"></span>
						</div>
						<div ng-if="mealPlanning.FoodMenu.EmployeeTypes.length > 1">
							<ul class="group-toggle-item">
								<li ng-repeat="type in mealPlanning.FoodMenu.EmployeeTypes" ng-bind="type.EmployeeTypeName"></li>
							</ul>
						</div>
					</td>
					<td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}" ng-bind="food.FoodVnmName">
					</td>
					<td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}" 
						ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center" >
						<input type="checkbox" ng-checked="mealPlanning.IsActive" />
					</td>
					<td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}" 
						ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center" >
						<a class="glyphicon glyphicon-edit" href="" ng-click="edit()"></a>
						<a class="glyphicon glyphicon-remove icon-remove" href=""></a>
					</td>
				</tr>
				<tr ng-show="mealPlanning.FoodMenu.FoodItems.length == 0" >
					<td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}" class="text-center" ng-bind="mealPlanning.itemIndex + 1"></td>
					<td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}" ng-bind="mealPlanning.FoodMenu.MenuVnmName"></td>
					<td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}" ng-bind="mealPlanning.Date | customDate"></td>
					<td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}">
						<div ng-if="mealPlanning.FoodMenu.Meals.length == 1" >
							<span ng-bind="mealPlanning.FoodMenu.Meals[0].MealEngName"></span>
						</div>
						<div ng-if="mealPlanning.FoodMenu.Meals.length > 1" >
							<ul class="group-toggle-item">
								<li ng-repeat="meal in mealPlanning.FoodMenu.Meals" ng-bind="meal.MealEngName"></li>
							</ul>
						</div>
					</td>
					<td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}" class="text-center">
						<span data-translate="Yes" ng-if="mealPlanning.FoodMenu.IsVegetarian"></span>
						<span data-translate="No" ng-if="!mealPlanning.FoodMenu.IsVegetarian"></span>
					</td>
					<td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}">
						<div ng-if="mealPlanning.FoodMenu.EmployeeTypes.length == 1">
							<span ng-bind="mealPlanning.FoodMenu.EmployeeTypes[0].EmployeeTypeName"></span>
						</div>
						<div ng-if="mealPlanning.FoodMenu.EmployeeTypes.length > 1">
							<ul class="group-toggle-item">
								<li ng-repeat="type in mealPlanning.FoodMenu.EmployeeTypes" ng-bind="type.EmployeeTypeName"></li>
							</ul>
						</div>
					</td>
					<td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}" colspan="3">
						<a class="icon plus" href="" ng-click="addMealPlanning(mealPlanning)" title="Add Meal Planning">
						</a>
					</td>
				</tr>
			</tbody>
			<tbody ng-if="mealPlannings.length == 0 || pagedItems.length == 0">
				<tr>
					<td class="empty-result" colspan="9" data-translate="EmptyResult">
					</td>
				</tr>
			</tbody>
			<tfoot>
				<tr>
					<td colspan="9" class="paging" >
						<span data-translate="Show"></span>
						<select class="dropdown-entry" ng-model="entrySelected" ng-change="showEntries()"
							ng-options="entry for entry in entries">
						</select>
						<span data-translate="entries"></span>
						<pagination-bar></pagination-bar>
					</td>
				</tr>
			</tfoot>
		</table>
	</div>
</div>
