<div class="col-sm-12">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li class="current" data-translate="MealPlanningManagement"></li>
        </ul>
    </div>
    <div class="row filter">
        <form class="form-inline" role="form">
        <div class="form-group mealplanning-filter">
            <label data-translate="Meal">
            </label>
            <div class="sel-meal field selectbox">
                <add-class-to-role-filter multi-select input-model="mealsOption" button-label="MealEngName"
                    helper-elements="all reset" item-label="MealEngName" tick-property="ticked" max-labels="0"
                    class="multi-select">
				</add-class-to-role-filter>
            </div>
        </div>
        <div class="form-group mealplanning-filter">
            <label data-translate="EmployeeType">
            </label>
            <div class="sel-meal field selectbox">
                <add-class-to-role-filter multi-select input-model="employeeTypesOption" button-label="EmployeeTypeId"
                    helper-elements="all reset" item-label="EmployeeTypeName" tick-property="ticked"
                    max-labels="0" class="multi-select employee-type">
					</add-class-to-role-filter>
            </div>
        </div>
        <div class="form-group">
            <label data-translate="From">
            </label>
            <input class="calendar-form-control" type="text" ng-model="filter.startDate" datepicker-popup
                is-open="calendar.startDateOpened" ng-click="calendar.startDateOpened=true" />
            <calendar-image class="calendar-image" ng-click="openPopupStartDate($event)"></calendar-image>
        </div>
        <div class="form-group">
            <label data-translate="To">
            </label>
            <input class="calendar-form-control" type="text" ng-model="filter.endDate" datepicker-popup
                is-open="calendar.endDateOpened" ng-click="calendar.endDateOpened=true" />
            <calendar-image class="calendar-image" ng-click="openPopupEndDate($event)"></calendar-image>
        </div>
        <div class="form-group">
            <input type="button" class="button pull-right" value="Submit" ng-click="query(filter)" />
        </div>
        </form>
    </div>
    <div class="row table-mealPlanning">
        <table class="table table-bordered table-striped col-sm-12">
            <thead>
                <tr class="header-table">
                    <th colspan="9" ng-show="policy.permission == 2">
                        <a class="pull-left button-icon create-button" ng-click="addMealPlanning('', false)"
                            ng-show="policy.permission == 2"><span class="icon plus"></span><span class="button-text"
                                data-translate="CreateMealPlanning"></span></a>
                        <input type="text" ng-model="queryData" ng-change="search()" class="search-inline-textbox search pull-right">
                    </th>
                    <th colspan="8" ng-show="policy.permission == 1">
                        <input type="text" ng-model="queryData" ng-change="search()" class="search-inline-textbox search pull-right">
                    </th>
                </tr>
                <tr>
                    <th data-translate="SymbolCount">
                    </th>
                    <th data-translate="FoodMenuVnm">
                    </th>
                    <th data-translate="Date">
                    </th>
                    <th class="width-150" data-translate="Meal">
                    </th>
                    <th class="width-60">
                        {{"ShortVegetarian" | translate}}.
                    </th>
                    <th class="" data-translate="EmployeeType">
                    </th>
                    <th class="width-300" data-translate="FoodItem">
                    </th>
                    <th class="width-60" data-translate="Active">
                    </th>
                    <th class="width-80" data-translate="Action" ng-show="policy.permission == 2">
                    </th>
                </tr>
            </thead>
            <tbody ng-repeat="mealPlanning in pagedItems[currentPage]">
                <tr ng-repeat="food in mealPlanning.FoodMenu.FoodItems" ng-show="mealPlanning.FoodMenu.FoodItems.length > 0">
                    <td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}"
                        ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center"
                        ng-bind="mealPlanning.itemIndex + 1">
                    </td>
                    <td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}"
                        ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" ng-bind="mealPlanning.FoodMenu.MenuVnmName">
                    </td>
                    <td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}"
                        ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" ng-bind="mealPlanning.Date | customDate">
                    </td>
                    <td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}"
                        ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}">
                        <div ng-if="mealPlanning.FoodMenu.Meals.length == 1">
                            <span ng-bind="mealPlanning.FoodMenu.Meals[0].MealEngName"></span>
                        </div>
                        <div ng-if="mealPlanning.FoodMenu.Meals.length > 1">
                            <ul class="group-toggle-item">
                                <li ng-repeat="meal in mealPlanning.FoodMenu.Meals" ng-bind="meal.MealEngName"></li>
                            </ul>
                        </div>
                    </td>
                    <td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}"
                        ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center">
                        <span data-translate="Yes" ng-if="mealPlanning.FoodMenu.IsVegetarian"></span><span
                            data-translate="No" ng-if="!mealPlanning.FoodMenu.IsVegetarian"></span>
                    </td>
                    <td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}"
                        ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}">
                        <div ng-if="mealPlanning.FoodMenu.EmployeeTypes.length == 1">
                            <span ng-bind="mealPlanning.FoodMenu.EmployeeTypes[0].EmployeeTypeName"></span>
                        </div>
                        <div ng-if="mealPlanning.FoodMenu.EmployeeTypes.length > 1">
                            <ul class="group-toggle-item">
                                <li ng-repeat="type in mealPlanning.FoodMenu.EmployeeTypes" ng-bind="type.EmployeeTypeName">
                                </li>
                            </ul>
                        </div>
                    </td>
                    <td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}"
                        ng-bind="food.FoodVnmName">
                    </td>
                    <td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}"
                        ng-show="$first" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center">
                        <input type="checkbox" ng-checked="mealPlanning.IsActive" ng-click="confirmActive(mealPlanning)"
                            ng-if="policy.permission == 2" ng-disabled="mealPlanning.IsDisable" />
                        <img class="ico-tick" ng-if="policy.permission == 1 && mealPlanning.IsActive" />
                    </td>
                    <td ng-class="{oddRow: $parent.$index % 2 == 0, evenRow: $parent.$index % 2 != 0}"
                        ng-show="$first && policy.permission == 2" rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}"
                        class="text-center">
                        <div ng-show="!mealPlanning.IsDisable">
                            <a class="glyphicon glyphicon-edit" href="" ng-click="edit(mealPlanning)"></a><a
                                class="glyphicon glyphicon-remove icon-remove" href="" ng-click="deleteMealPlanning(mealPlanning)">
                            </a>
                        </div>
                    </td>
                </tr>
                <tr ng-show="mealPlanning.FoodMenu.FoodItems.length == 0">
                    <td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}" class="text-center"
                        ng-bind="mealPlanning.itemIndex + 1">
                    </td>
                    <td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}" ng-bind="mealPlanning.FoodMenu.MenuVnmName">
                    </td>
                    <td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}" ng-bind="mealPlanning.Date | customDate">
                    </td>
                    <td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}">
                        <div ng-if="mealPlanning.FoodMenu.Meals.length == 1">
                            <span ng-bind="mealPlanning.FoodMenu.Meals[0].MealEngName"></span>
                        </div>
                        <div ng-if="mealPlanning.FoodMenu.Meals.length > 1">
                            <ul class="group-toggle-item">
                                <li ng-repeat="meal in mealPlanning.FoodMenu.Meals" ng-bind="meal.MealEngName"></li>
                            </ul>
                        </div>
                    </td>
                    <td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}" class="text-center">
                        <span data-translate="Yes" ng-if="mealPlanning.FoodMenu.IsVegetarian"></span><span
                            data-translate="No" ng-if="!mealPlanning.FoodMenu.IsVegetarian"></span>
                    </td>
                    <td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}">
                        <div ng-if="mealPlanning.FoodMenu.EmployeeTypes.length == 1">
                            <span ng-bind="mealPlanning.FoodMenu.EmployeeTypes[0].EmployeeTypeName"></span>
                        </div>
                        <div ng-if="mealPlanning.FoodMenu.EmployeeTypes.length > 1">
                            <ul class="group-toggle-item">
                                <li ng-repeat="type in mealPlanning.FoodMenu.EmployeeTypes" ng-bind="type.EmployeeTypeName">
                                </li>
                            </ul>
                        </div>
                    </td>
                    <td ng-show="!mealPlanning.IsExist && policy.permission == 2" ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}"
                        class="text-center" colspan="3">
                        <a class="icon plus" href="" ng-show="!mealPlanning.IsDisable" ng-click="addMealPlanning(mealPlanning, true)"
                            title="Add Meal Planning"></a>
                    </td>
                    <td ng-show="!mealPlanning.IsExist && policy.permission == 1" ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}"
                        class="text-center" colspan="2">
                    </td>
                    <td ng-show="mealPlanning.IsExist" ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}">
                    </td>
                    <td ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}" ng-show="mealPlanning.IsExist"
                        rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center">
                        <input type="checkbox" ng-checked="mealPlanning.IsActive" ng-click="confirmActive(mealPlanning)"
                            ng-show="policy.permission == 2" ng-disabled="mealPlanning.IsDisable" />
                        <img class="ico-tick" ng-if="policy.permission == 1 && mealPlanning.IsActive" />
                    </td>
                    <td ng-show="mealPlanning.IsExist && policy.permission == 2" ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}"
                        rowspan="{{mealPlanning.FoodMenu.FoodItems.length}}" class="text-center">
                        <div ng-show="!mealPlanning.IsDisable">
                            <a class="glyphicon glyphicon-edit" href="" ng-click="edit(mealPlanning)"></a><a
                                class="glyphicon glyphicon-remove icon-remove" href="" ng-click="deleteMealPlanning(mealPlanning)">
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
            <tbody ng-if="mealPlannings.length == 0 || pagedItems.length == 0">
                <tr>
                    <td class="empty-result" colspan="9" data-translate="EmptyResult">
                    </td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="9" class="paging">
                        <span data-translate="Show"></span>
                        <select class="dropdown-entry" ng-model="entrySelected" ng-change="showEntries()"
                            ng-options="entry for entry in entries">
                        </select>
                        <span data-translate="entries"></span>
                        <pagination-bar></pagination-bar>
                    </td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
