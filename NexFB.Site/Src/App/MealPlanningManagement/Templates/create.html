<div class="modal-header">
    <div class="popup-header">
        {{"CreateMealPlanning" | translate}}<span class="close-popup" ng-click="cancel()"></span>
    </div>
</div>
<div class="modal-body assign-role-modal meal-planning-body-modal">
    <form class="form-inline" role="form">
            <div class="form-group required">
                <label class="control-label" data-translate="Menu"></label>
        <select ng-model="mealPlanning.menuId" ng-options="opt.MenuId as opt.MenuVnmName for opt in menuOptions"
            required class="form-control" ng-disabled="currentMealPlanning">
            <option value="">-- {{"SelectMenu" | translate}} --</option>
        </select>
    </div>
            <div class="form-group required">
                <label class="control-label" data-translate="Date"></label>
        <input class="calendar-form-control" type="text" ng-model="mealPlanning.date" datepicker-popup
            is-open="calendar.startDateOpened" ng-click="calendar.startDateOpened=true" ng-disabled="currentMealPlanning" />
        <calendar-image class="calendar-image" ng-click="openPopupStartDate($event)" ng-show="!currentMealPlanning"></calendar-image>
    </div>
    <div class="form-group">
        <input type="checkbox" ng-model="mealPlanning.isActive" />
        <label data-translate="Active">
        </label>
    </div>

	<div class="form-group">
		<label data-translate="SetMenu"></label>
		<select ng-model="mealPlanning.setMenuId" ng-options="opt.SetMenuId as opt.SetMenuVnmName for opt in setMenuItems"
		 food-and-setmenu 
			class="form-control">
			<option value="">-- {{"SelectSetMenu" | translate}} --</option>
		</select>
	</div>
    </form>
	
    <div class="meal-planning">
        <label>
            {{"FoodItems" | translate}}:</label>
        <div class="menu-box">
            <select name="foodSelect" class="chosen-select" data-placeholder="Select food item(s)"
                multiple meal-planning-multi-select name="foodItemGroup" ng-model="rawFoodIds"
                ng-options="opt.FoodId as opt.FoodVnmName for opt in foodOptions">
            </select>
        </div>
    </div>
    <div>
        <ul class="list-unstyled foodItem-box">
            <li ng-repeat="food in foodItems"><a href="" ng-click="setIndex($index)">{{$index +
                1}}. {{food.FoodVnmName}} </a></li>
        </ul>
        <div class="btn-box">
            <button data-translate="Up" ng-click="upFoodItems(selectedIndex)">
            </button>
            <button data-translate="Down" ng-click="downFoodItems(selectedIndex)">
            </button>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button class="button" data-translate="Submit" ng-click="save()" ng-disabled="disabledSubmitButton">
    </button>
    <button class="button" data-translate="SubmitContinue" reset-meal-planning ng-click="saveAndContinue()"
        ng-disabled="disabledSubmitButton" ng-show="!currentMealPlanning">
    </button>
    <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
    </button>
</div>
