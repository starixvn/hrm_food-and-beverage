 <div>
	<div class="modal-header">
		<div class="popup-header">
			{{"CreateMealPlanning" | translate}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body assign-role-modal meal-planning-body-modal">
        <form class="form-inline" role="form">
            <div class="form-group">
                <label data-translate="Menu"></label>
				<select ng-model="menuId" ng-options="opt.MenuId as opt.MenuVnmName for opt in menuOptions"
					required class="form-control" ng-change="getFoodItems(menuId)">
					<option value="">-- {{"AllMenus" | translate}} --</option>
				</select>
            </div>
            <div class="form-group">
                <label data-translate="Date"></label>
				<input class="calendar-form-control" type="text" ng-model="onDate" datepicker-popup
					is-open="calendar.startDateOpened" ng-click="calendar.startDateOpened=true" />
				<calendar-image class="calendar-image" ng-click="openPopupStartDate($event)"></calendar-image>
            </div>
        </form>
		<div>
			<label class="filterRow">{{"FoodItems" | translate}}:</label>
			<div class="menu-box">
				<select name="foodSelect" class="chosen-select" data-placeholder="Select food item(s)" multiple multi-select-chosen name="foodItemGroup"
					ng-model="foodMenu.rawFoodIds" ng-options="opt.FoodId as opt.FoodVnmName for opt in groupOptions">
				</select>
			</div>
		</div>
	</div>

	<div class="modal-footer">
		<button class="button" get-meal-registration data-translate="Submit">
		</button>
		<button class="button" get-meal-registration data-translate="SubmitContinue">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
