<div class="col-sm-10">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li class="current" data-translate="ManageGroup"></li>
        </ul>
    </div>
    <div class="row filter">
        <form class="form-inline" role="form">
            <div class="form-group">
                <label data-translate="Group"></label>
                <select ng-model="filter.groupId" ng-options="opt.GroupId as opt.GroupName for opt in groupOptions" class="form-control">
                    <option value="">-- {{"AllGroups" | translate}} --</option>
                </select>
            </div>
            <div class="form-group">
                <label data-translate="Status"></label>
                <select ng-model="filter.isActive">
                    <option selected value="" data-translate="AllStatuses"></option>
                    <option value="true" data-translate="Active"></option>
                    <option value="false" data-translate="InActive"></option>
                </select>
            </div>
            <div class="form-group">
                <input type="button" value="Submit" class="button" ng-click="query(filter)"/>
            </div>
        </form>
    </div>
    <div class="row table-menu">
	    <table class="table table-bordered table-striped col-sm-12">
	        <thead>
	            <tr class="header-table">
	                <th colspan="5" ng-show="policy.permission == 2">
		                <a class="pull-left button-icon create-button" ng-click="addGroup()" >
			                <span class="icon plus"></span>
			                <span class="button-text" data-translate="CreateGroup"></span>
		                </a>
		                <input type="text" ng-model="queryData" ng-change="search()" class="search-inline-textbox search pull-right">
	                </th>
	                <th colspan="4" ng-show="policy.permission == 1">
		                <input type="text" ng-model="queryData" ng-change="search()" class="search-inline-textbox search pull-right">
	                </th>
                </tr>

	            <tr>
	                <th data-translate="SymbolCount"></th>
	                <th class="width-60" data-translate="Group"></th>
	                <th data-translate="Member"></th>
	                <th data-translate="Active"></th>
	                <th data-translate="Action"></th>
	            </tr>
	        </thead>
	        <tbody>
	            <tr ng-repeat="group in pagedItems[currentPage] track by group.GroupId">
	                <td class="text-center" ng-bind="group.itemIndex + 1">
	                </td>
	                <td ng-bind="group.GroupName">
	                </td>
	                <td class="text-center">
	                    <a ng-href="/ManageGroup/User?groupId={{group.GroupId}}" ng-bind="group.Members"></a>
	                </td>
	                <td class="text-center">
	                    <input type="checkbox" ng-disabled="true" ng-checked="group.IsActive"/>
	                </td>
	                <td class="text-center" ng-if="policy.permission == 2">
	                    <a class="glyphicon glyphicon-edit" href="" ng-click="editGroup(group)"></a>
	                    <a class="glyphicon glyphicon-remove icon-remove" href="" ng-click="deleteGroup(group)"></a>
	                </td>
	            </tr>
	            <tr ng-show="groups.length == 0">
	                <td class="empty-result" colspan="5" data-translate="EmptyResult">
	                </td>
	            </tr>
	        </tbody>
            <tfoot>
	            <tr>
		            <td colspan="5" class="paging" >
			            <span data-translate="Show"></span>
			            <select class="dropdown-entry" ng-model="entrySelected" ng-change="showEntries()" 
				            ng-options="entry for entry in entries">
			            </select>
			            <span data-translate="entries"></span>
			            <pagination-bar></pagination-bar>
		            </td>
	            </tr>
            </tfoot>
	    </table>
    </div>
</div>
