<div>
    <div class="modal-header">
        <div class="popup-header">
            {{"CreateGroup" | translate}}<span class="close-popup" ng-click="cancel()"></span>
        </div>
    </div>
    <div class="modal-body manage-group-body-modal">
        <form class="form-horizontal form-manage-group col-sm-11" role="form" name="createGroupForm" ng-init="setFormScope(this)">
            <div class="form-group required">
                <label class="col-sm-3 control-label">{{"Group" | translate}}</label>
                <div class="col-sm-9 field">
                    <input type="text" class="form-control" ng-model="group.GroupName" maxlength="40" required />
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">{{"Active" | translate}}</label>
                <div class="col-sm-9 field side-dish-active-div">
                    <input type="checkbox" ng-model="group.isActive" ng-check="group.isActive"  />
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button class="button" data-translate="Submit" ng-disabled="isDisabledSubmitButton" ng-click="addGroup(group)" />
        <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel" />
	</div>
</div>
