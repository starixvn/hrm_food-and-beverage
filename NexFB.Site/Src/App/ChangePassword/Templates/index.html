<div>
	<div class="modal-header">
		<div class="popup-header">
			{{"ChangePassword" | translate}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body">
        <form class="form-horizontal form-multiLine">
            <div class="form-group required">
                <label class="col-sm-5 text-right control-label">{{"OldPassword" | translate}}</label>
                <div class="col-sm-6 field">
                    <input type="password" class="form-control" maxlength="100" data-ng-model="changePassword.OldPassword"/>
                </div>
             
            </div>
			<div class="form-group required">
				<label class="col-sm-5 text-right control-label">{{"NewPassword" | translate}}</label>
				<div class="col-sm-6 field">
					<input type="password" class="form-control" maxlength="100" data-ng-model="changePassword.NewPassword" />
				</div>
            </div>
			<div class="form-group required">
				<label class="col-sm-5 text-right control-label">{{"ConfirmPassword" | translate}}</label>
				<div class="col-sm-6 field">
					<input type="password" class="form-control" maxlength="100" data-ng-model="changePassword.ConfirmPassword" />
				</div>
            </div>
        </form>
	</div>

	<div class="modal-footer">
		<button class="button" data-translate="Submit" data-ng-click="save(changePassword)" ng-disabled="disabledSubmitButton" >
		</button>
		<button class="btn btn-default customize" data-ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
