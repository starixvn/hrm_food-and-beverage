
<div class="modal-header">
    <div class="popup-header">
        {{"EditAlternativeMenu" | translate}}<span class="close-popup" ng-click="cancel()"></span>
    </div>
</div>
<div class="modal-body alt-menu-body-modal">
    <form class="form-horizontal col-sm-11" role="form">
    <div class="form-group required">
        <label class="col-sm-4 control-label" data-translate="MenuCode">
        </label>
        <div class="col-sm-8 field">
            <input type="text" class="form-control" ng-model="altMenu.AlternativeMenuCode" required />
        </div>
    </div>
    <div class="form-group required">
        <label class="col-sm-4 control-label" data-translate="FoodMenuNameVnm">
        </label>
        <div class="col-sm-8 field">
            <input type="text" class="form-control" ng-model="altMenu.AlternativeMenuVnmName" required />
        </div>
    </div>
    <div class="form-group required">
        <label class="col-sm-4 control-label" data-translate="MenuNameEng">
        </label>
        <div class="col-sm-8 field">
            <input type="text" class="form-control" ng-model="altMenu.AlternativeMenuEngName" required />
        </div>
    </div>
    <div class="form-group required">
        <label class="col-sm-4 control-label" data-translate="EmployeeType">
        </label>
        <div class="col-sm-5 field selectbox">
            <add-class-to-role-filter multi-select input-model="employeeTypesOption" button-label="EmployeeTypeId"
                helper-elements="all reset" item-label="EmployeeTypeName" tick-property="ticked"
                max-labels="0" class="multi-select employee-type">
			</add-class-to-role-filter>
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-4 control-label side-dish-active-label" data-translate="Active">
        </label>
        <div class="col-sm-8 field side-dish-active-div">
            <input type="checkbox" ng-model="altMenu.IsActive" />
        </div>
    </div>
    </form>
</div>
<div class="modal-footer">
    <button class="button" data-translate="Submit" ng-click="save(altMenu)" ng-disabled="disabledSubmitButton">
    </button>
    <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
    </button>
</div>
