<div ng-controller="MonthlyRegistrationController">
 	<table class="table table-bordered table-register">
		<thead>
			<tr>
				<th class="width-100">
					<a href="" ng-click="registerMealMonth(weekMeals)">Jul 2014</a>
				</th>
				<th>
					<a href="" ng-click="registerMealDate('Sun')" data-translate="Sun"></a>
				</th>
				<th>
					<a href="" ng-click="registerMealDate('Mon')" data-translate="Mon"></a>
				</th>
				<th>
					<a href="" ng-click="registerMealDate('Tue')" data-translate="Tue"></a>
				</th>
				<th>
					<a href="" ng-click="registerMealDate('Wed')"" data-translate="Wed"></a>
				</th>
				<th>
					<a href="" ng-click="registerMealDate('Thu')" data-translate="Thu"></a>
				</th>
				<th>
					<a href="" ng-click="registerMealDate('Fri')" data-translate="Fri"></a>
				</th>
				<th>
					<a href="" ng-click="registerMealDate('Sat')" data-translate="Sat"></a>
				</th>
			</tr>
		</thead>
		<tbody>
			<tr ng-repeat="week in weekMeals">
				<td class="text-center lbl-week" >
					<a href="" ng-click="registerMealWeek(week)">{{"Week" | translate}} {{$index + 1}}</a>
                </td>
                <td ng-repeat="date in week.WeekMeals" ng-click="date.IsDisabled || registerMeal(date)"
					ng-class="{disabled: date.IsDisabled, current: checkCurrentDate(date) }" >
                    <span class="pull-right" ng-bind="date.WorkDate | date: 'd'">
					</span>
                    <div ng-repeat="meal in date.Meals">
                        <span get-class-by-name ng-class="mealClass" ng-show="meal.IsVegetarian != null" class="txt-name">{{meal.ShortName}}:
						</span> 
						<span class="icon-veg" ng-show="meal.IsVegetarian == 1">
						</span>
						<span class="icon-none-veg" ng-show="meal.IsVegetarian == 0">
                        </span>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
    <div class="note-meal">
        <ul class="list-unstyled list-inline">
            <li class="lbl-breakfast">B: {{"Breakfast" | translate}}</li>
            <li class="lbl-lunch">L: {{"Lunch" | translate}}</li>
            <li class="lbl-dinner">D: {{"Dinner" | translate}}</li>
            <li class="lbl-supper">S: {{"Supper" | translate}}</li>
        </ul>
        <ul class="list-unstyled list-inline">
            <li><i class="icon-none-veg"></i>{{"Non-Vegetarian" | translate}}</li>
            <li><i class="icon-veg"></i>{{"Vegetarian" | translate}}</li>
        </ul>
    </div>
</div>
