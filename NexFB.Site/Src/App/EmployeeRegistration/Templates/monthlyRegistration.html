<div ng-controller="MonthlyRegistrationController">
	<table class="table">
		<thead>
			<tr>
				<th>
					<button class="button" ng-click="registerMealMonth(weekMeals)">Jul 2014</button>
				</th>
				<th>
					<button class="button" ng-click="registerMealDate('Sun')">Sun</button>
				</th>
				<th>
					<button class="button" ng-click="registerMealDate('Mon')">Mon</button>
				</th>
				<th>
					<button class="button" ng-click="registerMealDate('Tue')">Tue</button>
				</th>
				<th>
					<button class="button"ng-click="registerMealDate('Wed')">Wed</button>
				</th>
				<th>
					<button class="button" ng-click="registerMealDate('Thu')">Thu</button>
				</th>
				<th>
					<button class="button" ng-click="registerMealDate('Fri')">Fri</button>
				</th>
				<th>
					<button class="button" ng-click="registerMealDate('Sat')">Sat</button>
				</th>
			</tr>
		</thead>
		<tbody>
			<tr ng-repeat="week in weekMeals">
				<td>
					<button class="button" ng-click="registerMealWeek(week)">Week {{$index + 1}}
					</button>
				</td>
				<td ng-repeat="date in week.WeekMeals" ng-click="registerMeal(date)">
					<span style="float:right;" ng-bind="date.WorkDate | date: 'd'"></span>
					<div ng-repeat="meal in date.Meals">
						<span ng-show="meal.IsVegetarian">{{meal.ShortName}}:</span>
						<span ng-bind="Vegatarian" ng-show="meal.IsVegetarian == true"></span>
						<span ng-bind="Non-Vegatarian" ng-show="meal.IsVegetarian == false"></span>
					</div>
				</td>
			</tr>
		</tbody>
	</table>
</div>
