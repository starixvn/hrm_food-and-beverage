
<div>
	<div class="modal-header">
		<div class="popup-header">
			{{"RegisterMeal" | translate}} - {{timePeriod}}<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body assign-role-modal">
		<form class="col-sm-12 form-horizontal table-popup" novalidate>
			<table name="registrationMeal" class="table table-bordered">
				<thead>
					<th data-translate="Meal">
					</th>
					<th>{{"ShortNonVegetarian" | translate}}
					</th>
					<th>{{"ShortVegetarian" | translate}}
					</th>
				</thead>
				<tbody>
					<tr ng-repeat="meal in meals" check-meal-timesheet >
						<td ng-bind="meal.MealEngName">
						</td>
						<td class="text-center width-100">
							<input id="meal{{meal.MealId}}_non" type="checkbox" value="{{meal.MealId}}" only-one-check
								 ng-checked="meal.IsVegetarian == false && isRegisterDate" ng-disabled="!rightMeal.{{meal.MealId}} || nonVegetarianDate.{{meal.MealId}}" />
						</td>
						<td class="text-center width-100">
							<input id="meal{{meal.MealId}}" type="checkbox" value="{{meal.MealId}}" only-one-check disable-vegetarian-day
								 ng-checked="meal.IsVegetarian && isRegisterDate" ng-disabled="!rightMeal.{{meal.MealId}} || vegetarianDate.{{meal.MealId}}"/>
						</td>
					</tr>
				</tbody>
			</table>
		</form>
	</div>

	<div class="modal-footer">
		<button class="button" get-meal-registration validate-meal-registration data-translate="Submit">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
