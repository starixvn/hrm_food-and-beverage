 <div>
	<div class="modal-header">
		<div class="popup-header">
			{{"Confirm" | translate}}
            <span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>

	<div class="modal-body">
        Do you want to save the current meal time setting?
	</div>

	<div class="modal-footer">
		<button class="button" ng-click='save()' data-translate="Yes">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="No">
		</button>
	</div>
</div>
