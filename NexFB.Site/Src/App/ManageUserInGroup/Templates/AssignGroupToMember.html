
<div id="confirmPopup">
	<div class="modal-header">
		<div class="popup-header">
			<span>{{"AssignAllSelectedHeader" | translate}}</span>
			<span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>
	<div class="modal-body assign-group-body">
		<form class="form-horizontal form-multiLine" role="form">
			<div class="form-group">
				<label class="col-sm-5 text-right control-label">{{"AssignSelectedMemberLabel" | translate}}:
				</label>
				<div class="col-sm-3 field selectbox">
					<add-class-to-role-filter multi-select input-model="groupOptions" button-label="GroupName" helper-elements="all reset"
						item-label="GroupName" tick-property="ticked" max-labels="0" max-height="300px" class="multi-select">
					</add-class-to-role-filter>
				</div>
			</div>
		</form>
	</div>
	<div class="modal-footer">
		<button class="button" data-translate="Submit" ng-click="save()" >
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
